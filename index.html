<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>救護隊目綜合 MC 動態模擬試卷</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans HK', system-ui, -apple-system, sans-serif;
      background-color: #f4f7fb;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-lg text-white shadow">
          🚑
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight">救護隊目綜合 MC 動態題庫系統</h1>
          <p class="text-xs text-slate-400" id="headerSubtext">無限次動態抽題｜精準分卷</p>
        </div>
      </div>

      <!-- Progress -->
      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <div class="text-xs font-semibold text-slate-300">
          已答 <span id="answeredCount" class="text-blue-400 font-bold">0</span> / <span id="totalCount">20</span> 題
        </div>
        <div class="w-28 sm:w-36 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
          <div id="progressBar" class="h-full bg-blue-500 transition-all duration-300 w-0"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- Hero Banner -->
    <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white rounded-2xl p-5 sm:p-7 shadow-xl mb-6 border border-slate-800">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <span class="inline-block px-2.5 py-1 text-xs font-bold bg-blue-500/20 text-blue-300 border border-blue-400/30 rounded-full mb-2">
            消防處救護隊目升級考 ‧ 隨機無限刷題版
          </span>
          <h2 class="text-xl sm:text-2xl font-black mb-1" id="paperTitle">甲卷：裝備與救護學</h2>
          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed" id="paperDesc">
            裝備日試、操作程序、人體與病理學基礎
          </p>
        </div>
        
        <!-- Controls -->
        <div class="flex flex-col gap-2 self-start md:self-auto min-w-[180px]">
          <button id="drawNewPaperBtn" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-xs px-3 py-2.5 rounded-xl shadow-md border border-blue-400/30 transition">
            <span>🎲 隨機抽取新試卷</span>
          </button>
          <div class="flex items-center gap-2 bg-slate-800/80 backdrop-blur px-3 py-2 rounded-xl border border-slate-700">
            <input type="checkbox" id="instantFeedbackToggle" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
            <label for="instantFeedbackToggle" class="text-xs font-semibold text-slate-200 cursor-pointer select-none">
              即時對答案模式
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Paper Navigation Tabs -->
    <nav class="flex gap-2 overflow-x-auto pb-2 mb-6 custom-scrollbar" id="tabNav"></nav>

    <!-- Result Box -->
    <div id="resultBox" class="hidden bg-white rounded-2xl border border-slate-200 shadow-md p-6 mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
        <div>
          <div class="text-xs text-slate-500 font-semibold uppercase tracking-wider">本卷成績統計</div>
          <div class="text-3xl sm:text-4xl font-black text-blue-600 mt-1" id="scoreText">0 / 20</div>
        </div>
        <div id="resultFeedback" class="text-sm font-bold text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200">
          --
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3 mt-4 text-center">
        <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl">
          <div class="text-xs text-emerald-600 font-semibold">答對</div>
          <div class="text-lg font-bold text-emerald-700" id="correctStat">0</div>
        </div>
        <div class="bg-rose-50 border border-rose-100 p-3 rounded-xl">
          <div class="text-xs text-rose-600 font-semibold">答錯</div>
          <div class="text-lg font-bold text-rose-700" id="wrongStat">0</div>
        </div>
        <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl">
          <div class="text-xs text-amber-600 font-semibold">未答</div>
          <div class="text-lg font-bold text-amber-700" id="blankStat">0</div>
        </div>
      </div>
      <div class="mt-4 flex flex-wrap gap-2 justify-end">
        <button id="filterWrongBtn" class="text-xs font-bold px-3 py-2 bg-rose-100 text-rose-700 rounded-lg hover:bg-rose-200 transition">
          切換：只顯示錯題
        </button>
        <button id="showAllBtn" class="text-xs font-bold px-3 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition hidden">
          顯示全部題目
        </button>
      </div>
    </div>

    <!-- Question Container -->
    <div id="questionsContainer" class="space-y-4"></div>

    <!-- Bottom Actions -->
    <div class="sticky bottom-4 mt-8 z-20">
      <div class="bg-white/90 backdrop-blur-md border border-slate-200 shadow-2xl rounded-2xl p-3 flex items-center justify-between gap-3 max-w-xl mx-auto">
        <button id="resetBtn" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition">
          重做當前題組
        </button>
        <button id="submitBtn" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-500/20 transition">
          提交並改卷
        </button>
      </div>
    </div>

  </main>

  <!-- Modal for Reset Confirmation -->
  <div id="confirmModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
      <h3 class="text-lg font-bold text-slate-900 mb-2">確定重置當前答案？</h3>
      <p class="text-sm text-slate-600 mb-6">這將會清空目前卷面上選擇的所有答案與批改記錄，但保留相同題組。</p>
      <div class="flex justify-end gap-3">
        <button id="cancelReset" class="px-4 py-2 rounded-xl text-slate-600 font-semibold text-sm bg-slate-100 hover:bg-slate-200">取消</button>
        <button id="confirmReset" class="px-4 py-2 rounded-xl text-white font-semibold text-sm bg-rose-600 hover:bg-rose-700">確定重置</button>
      </div>
    </div>
  </div>

  <script>
  // Comprehensive Master Question Pool Extracted Strictly from Uploaded Documents
  const questionPool = {

  // Fisher-Yates Shuffle Algorithm
  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initTabs() {
    const tabNav = document.getElementById('tabNav');
    tabNav.innerHTML = '';

    const tabsDef = [
      { name: '甲卷：裝備與救護學', index: 0 },
      { name: '乙卷：行動與常行訓令', index: 1 },
      { name: '丙卷：法例、國情與國安', index: 2 },
      { name: '🔥 全卷 60 題隨機大考', index: 3 }
    ];

    tabsDef.forEach(tab => {
      const btn = document.createElement('button');
      btn.className = `px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition border ${
        currentPaperTab === tab.index
          ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
          : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
      }`;
      btn.textContent = tab.name;
      btn.onclick = () => switchPaperTab(tab.index);
      tabNav.appendChild(btn);
    });
  }

  function switchPaperTab(tabIndex) {
    currentPaperTab = tabIndex;
    initTabs();
    generateAndRenderPaper(tabIndex);
  }

  function generateAndRenderPaper(tabIndex) {
    isGraded = false;
    currentFilterOnlyWrong = false;
    document.getElementById('resultBox').classList.add('hidden');
    document.getElementById('filterWrongBtn').classList.remove('hidden');
    document.getElementById('showAllBtn').classList.add('hidden');

    let drawn = [];

    if (tabIndex === 0) {
      document.getElementById('paperTitle').textContent = questionPool.paperA.name;
      document.getElementById('paperDesc').textContent = questionPool.paperA.desc;
      // Draw 20 random from Paper A
      const pool = shuffleArray(questionPool.paperA.questions);
      drawn = pool.slice(0, Math.min(20, pool.length));
    } else if (tabIndex === 1) {
      document.getElementById('paperTitle').textContent = questionPool.paperB.name;
      document.getElementById('paperDesc').textContent = questionPool.paperB.desc;
      // Draw 20 random from Paper B
      const pool = shuffleArray(questionPool.paperB.questions);
      drawn = pool.slice(0, Math.min(20, pool.length));
    } else if (tabIndex === 2) {
      document.getElementById('paperTitle').textContent = questionPool.paperC.name;
      document.getElementById('paperDesc').textContent = questionPool.paperC.desc;
      // Draw 20 random from Paper C
      const pool = shuffleArray(questionPool.paperC.questions);
      drawn = pool.slice(0, Math.min(20, pool.length));
    } else if (tabIndex === 3) {
      document.getElementById('paperTitle').textContent = '全卷 60 題綜合模擬考';
      document.getElementById('paperDesc').textContent = '跨範疇綜合測試：甲卷 20 題 + 乙卷 20 題 + 丙卷 20 題（每次隨機生成）';
      // Draw 20 from A, 20 from B, 20 from C
      const poolA = shuffleArray(questionPool.paperA.questions).slice(0, 20);
      const poolB = shuffleArray(questionPool.paperB.questions).slice(0, 20);
      const poolC = shuffleArray(questionPool.paperC.questions).slice(0, 20);
      drawn = [...poolA, ...poolB, ...poolC];
    }

    activeQuestions = drawn;
    renderQuestionsUI();
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderQuestionsUI() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    document.getElementById('totalCount').textContent = activeQuestions.length;

    activeQuestions.forEach((qData, qIdx) => {
      const [questionText, options, correctKey, explanation] = qData;
      const qNum = qIdx + 1;
      const inputName = `q_active_${qIdx}`;

      const card = document.createElement('article');
      card.className = 'q-card bg-white rounded-2xl p-5 border border-slate-200 shadow-sm transition-all duration-200';
      card.id = `card_${qIdx}`;

      let optionsHtml = options.map((optText, optIdx) => {
        const optionLetter = ['A', 'B', 'C', 'D'][optIdx];
        return `
          <label class="opt-label flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 cursor-pointer hover:border-blue-300 hover:bg-blue-50/50 transition bg-white select-none">
            <input type="radio" name="${inputName}" value="${optIdx}" class="mt-1 w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
            <div class="text-sm leading-snug flex-1">
              <span class="font-bold text-slate-700 mr-1">${optionLetter}.</span>
              <span class="text-slate-800">${optText}</span>
            </div>
          </label>
        `;
      }).join('');

      card.innerHTML = `
        <div class="flex items-start gap-3 mb-3">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-blue-100 text-blue-800 font-extrabold text-xs flex-shrink-0 mt-0.5">
            ${qNum}

          <h3 class="font-bold text-base text-slate-900 leading-snug">${questionText}</h3>
        </div>
        <div class="space-y-2.5 pl-0 sm:pl-10">
          ${optionsHtml}
        </div>
        <div class="explain-box hidden mt-4 ml-0 sm:ml-10 p-3.5 rounded-xl text-sm bg-blue-50 text-blue-900 border-l-4 border-blue-500">
          <div class="font-bold mb-0.5">正解：${['A','B','C','D'][correctKey]}</div>
          <div class="text-slate-700">${explanation}</div>
        </div>
      `;

      // Bind Event Listener
      card.querySelectorAll(`input[name="${inputName}"]`).forEach(input => {
        input.onchange = () => {
          updateProgress();
          if (instantFeedback) {
            checkSingleQuestion(card, qData, input.value);
          }
        };
      });

      container.appendChild(card);
    });
  }

  function checkSingleQuestion(card, qData, userVal) {
    const [, , correctKey] = qData;
    const labels = card.querySelectorAll('.opt-label');
    const explainBox = card.querySelector('.explain-box');

    explainBox.classList.remove('hidden');

    labels.forEach((label, idx) => {
      label.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-500', 'bg-rose-50');
      if (idx === correctKey) {
        label.classList.add('border-emerald-500', 'bg-emerald-50');
      }
      if (userVal !== undefined && parseInt(userVal) === idx && idx !== correctKey) {
        label.classList.add('border-rose-500', 'bg-rose-50');
      }
    });

    card.classList.remove('border-emerald-300', 'border-rose-300', 'bg-emerald-50/20', 'bg-rose-50/20');
    if (parseInt(userVal) === correctKey) {
      card.classList.add('border-emerald-300', 'bg-emerald-50/20');
    } else {
      card.classList.add('border-rose-300', 'bg-rose-50/20');
    }
  }

  function updateProgress() {
    let answered = 0;
    activeQuestions.forEach((_, qIdx) => {
      const checked = document.querySelector(`input[name="q_active_${qIdx}"]:checked`);
      if (checked) answered++;
    });

    document.getElementById('answeredCount').textContent = answered;
    const total = activeQuestions.length;
    const pct = total > 0 ? (answered / total) * 100 : 0;
    document.getElementById('progressBar').style.width = `${pct}%`;
  }

    document.getElementById('filterWrongBtn').onclick = () => {
      currentFilterOnlyWrong = true;
      document.getElementById('filterWrongBtn').classList.add('hidden');
      document.getElementById('showAllBtn').classList.remove('hidden');
      applyWrongFilter();
    };

    document.getElementById('showAllBtn').onclick = () => {
      currentFilterOnlyWrong = false;
      document.getElementById('filterWrongBtn').classList.remove('hidden');
      document.getElementById('showAllBtn').classList.add('hidden');
      applyWrongFilter();
    };
  }

  function gradePaper() {
    let score = 0;
    let wrongCount = 0;
    let blankCount = 0;

    activeQuestions.forEach((qData, qIdx) => {
      const card = document.getElementById(`card_${qIdx}`);
      const checked = document.querySelector(`input[name="q_active_${qIdx}"]:checked`);
      const correctKey = qData[2];

      checkSingleQuestion(card, qData, checked ? checked.value : undefined);

      if (!checked) {
        blankCount++;
        card.dataset.status = 'wrong';
      } else if (parseInt(checked.value) === correctKey) {
        score++;
        card.dataset.status = 'correct';
      } else {
        wrongCount++;
        card.dataset.status = 'wrong';
      }
    });

    isGraded = true;
    const total = activeQuestions.length;
    const pct = Math.round((score / total) * 100);

    const resultBox = document.getElementById('resultBox');
    resultBox.classList.remove('hidden');

    document.getElementById('scoreText').textContent = `${score} / ${total}（${pct}%）`;
    document.getElementById('correctStat').textContent = score;
    document.getElementById('wrongStat').textContent = wrongCount;
    document.getElementById('blankStat').textContent = blankCount;

    const feedback = document.getElementById('resultFeedback');
    if (pct >= 80) {
      feedback.textContent = '🎉 表現優異！熟練掌握考點內容，請繼續保持。';
      feedback.className = 'text-sm font-bold text-emerald-800 bg-emerald-50 p-3 rounded-xl border border-emerald-200';
    } else if (pct >= 60) {
      feedback.textContent = '👍 達到合格水平，建議針對錯題加強重溫。';
      feedback.className = 'text-sm font-bold text-amber-800 bg-amber-50 p-3 rounded-xl border border-amber-200';
    } else {
      feedback.textContent = '⚠️ 表現未如理想，建議再次重溫相關常行訓令與裝備指引。';
      feedback.className = 'text-sm font-bold text-rose-800 bg-rose-50 p-3 rounded-xl border border-rose-200';
    }

    resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function applyWrongFilter() {
    activeQuestions.forEach((_, qIdx) => {
      const card = document.getElementById(`card_${qIdx}`);
      if (currentFilterOnlyWrong) {
        if (card.dataset.status === 'correct') {
          card.classList.add('hidden');
        } else {
          card.classList.remove('hidden');
        }
      } else {
        card.classList.remove('hidden');
      }
    });
  }

  function resetCurrentAnswers() {
    isGraded = false;
    currentFilterOnlyWrong = false;
    document.getElementById('resultBox').classList.add('hidden');
    document.getElementById('filterWrongBtn').classList.remove('hidden');
    document.getElementById('showAllBtn').classList.add('hidden');

    // Re-render UI with same active questions
    renderQuestionsUI();
    updateProgress();
  }
  </script>
</body>
