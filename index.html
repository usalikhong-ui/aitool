<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>香港巴士 ETA</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:#f3f4f6;
  color:#111827;
}
.app{
  max-width:680px;
  margin:0 auto;
  min-height:100vh;
  padding:16px;
}
.hero{
  background:linear-gradient(135deg,#d71920,#8f1115);
  color:white;
  padding:26px;
  border-radius:24px;
  margin-bottom:16px;
}
.hero h1{
  margin:0;
  font-size:32px;
  font-weight:900;
}
.card{
  background:white;
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
label{
  display:block;
  font-weight:900;
  margin:12px 0 6px;
}
input,select,button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #d1d5db;
  font-size:16px;
}
button{
  background:#d71920;
  color:white;
  border:0;
  font-weight:900;
  margin-top:12px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.item{
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:14px;
  margin-top:10px;
  background:white;
}
.title{
  font-weight:900;
  font-size:17px;
}
.meta{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
  line-height:1.45;
}
.eta{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:12px;
  margin-top:8px;
}
.eta-main{
  color:#d71920;
  font-size:25px;
  font-weight:900;
}
.status{
  text-align:center;
  color:#6b7280;
  padding:18px;
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  margin-right:6px;
}
.kmb{
  background:#fef2f2;
  color:#b91c1c;
}
.ctb{
  background:#eff6ff;
  color:#1d4ed8;
}
</style>
</head>

<body>
<div class="app">

  <div class="hero">
    <h1>香港巴士 ETA</h1>
  </div>

  <div class="card">
    <label>輸入路線</label>
    <input id="routeInput" value="694" placeholder="例如：694 / 1A / 970X" />

    <div class="grid">
      <div>
        <label>公司</label>
        <select id="companyInput">
          <option value="all">全部</option>
          <option value="kmb">九巴</option>
          <option value="ctb">城巴</option>
        </select>
      </div>

      <div>
        <label>方向</label>
        <select id="directionInput">
          <option value="outbound">去程</option>
          <option value="inbound">回程</option>
        </select>
      </div>
    </div>

    <button onclick="searchRoute()">搜尋</button>
  </div>

  <div class="card">
    <div id="status" class="status">準備查詢</div>
    <div id="results"></div>
  </div>

</div>

<script>
const KMB = "https://data.etabus.gov.hk/v1/transport/kmb";
const CTB = "https://rt.data.gov.hk/v2/transport/citybus";

let kmbStops = {};
let ctbStops = {};

function status(text){
  document.getElementById("status").textContent = text;
}

function clearResults(){
  document.getElementById("results").innerHTML = "";
}

async function getJson(url){
  const response = await fetch(url);
  if(!response.ok){
    throw new Error("HTTP " + response.status + " : " + url);
  }
  return await response.json();
}

function formatMinutes(etaString){
  if(!etaString) return "沒有資料";
  const eta = new Date(etaString);
  const now = new Date();
  const minutes = Math.round((eta - now) / 60000);
  if(minutes <= 0) return "即將到站";
  return minutes + " 分鐘";
}

function formatTime(etaString){
  if(!etaString) return "-";
  return new Date(etaString).toLocaleTimeString("zh-HK", {
    hour:"2-digit",
    minute:"2-digit"
  });
}

async function loadStopData(){
  if(Object.keys(kmbStops).length === 0){
    try{
      const data = await getJson(KMB + "/stop");
      (data.data || []).forEach(stop => {
        kmbStops[stop.stop] = stop;
      });
    }catch(e){
      console.warn("KMB stop load failed", e);
    }
  }

  if(Object.keys(ctbStops).length === 0){
    try{
      const data = await getJson(CTB + "/stop/ctb");
      (data.data || []).forEach(stop => {
        ctbStops[stop.stop] = stop;
      });
    }catch(e){
      console.warn("CTB stop load failed", e);
    }
  }
}

function getStopName(company, stopId){
  if(company === "kmb"){
    return kmbStops[stopId]?.name_tc || kmbStops[stopId]?.name_en || "未命名車站";
  }

  if(company === "ctb"){
    return ctbStops[stopId]?.name_tc || ctbStops[stopId]?.name_en || "未命名車站";
  }

  return "未命名車站";
}

async function searchRoute(){
  clearResults();

  const route = document.getElementById("routeInput").value.trim().toUpperCase();
  const company = document.getElementById("companyInput").value;
  const direction = document.getElementById("directionInput").value;

  if(!route){
    status("請輸入路線");
    return;
  }

  status("正在搜尋...");
  await loadStopData();

  let results = [];

  if(company === "all" || company === "kmb"){
    const kmbResult = await searchKmbRoute(route, direction);
    results = results.concat(kmbResult);
  }

  if(company === "all" || company === "ctb"){
    const ctbResult = await searchCtbRoute(route, direction);
    results = results.concat(ctbResult);
  }

  if(results.length === 0){
    status("找不到路線。請試另一個方向，或改選九巴 / 城巴。");
    return;
  }

  status("找到 " + results.length + " 個車站");
  results.forEach(renderStop);
}

async function searchKmbRoute(route, direction){
  try{
    const url = KMB + "/route-stop/" + route + "/" + direction + "/1";
    const data = await getJson(url);

    return (data.data || []).map(item => {
      return {
        company:"kmb",
        companyName:"九巴",
        route:route,
        direction:direction,
        seq:item.seq,
        stop:item.stop,
        name:getStopName("kmb", item.stop)
      };
    });
  }catch(e){
    console.warn("KMB route failed", e);
    return [];
  }
}

async function searchCtbRoute(route, direction){
  try{
    const url = CTB + "/route-stop/ctb/" + route + "/" + direction;
    const data = await getJson(url);

    return (data.data || []).map(item => {
      return {
        company:"ctb",
        companyName:"城巴",
        route:route,
        direction:direction,
        seq:item.seq,
        stop:item.stop,
        name:getStopName("ctb", item.stop)
      };
    });
  }catch(e){
    console.warn("CTB route failed", e);
    return [];
  }
}

function renderStop(item){
  const badgeClass = item.company === "kmb" ? "kmb" : "ctb";
  const directionText = item.direction === "outbound" ? "去程" : "回程";

  const div = document.createElement("div");
  div.className = "item";

  div.innerHTML = `
    <div class="title">
      <span class="badge ${badgeClass}">${item.companyName}</span>
      第 ${item.seq} 站｜${item.name}
    </div>

    <div class="meta">
      路線：${item.route}｜方向：${directionText}
    </div>

    <button onclick="loadEta('${item.company}', '${item.stop}', '${item.route}', this)">
      查此站 ETA
    </button>

    <div class="etaBox"></div>
  `;

  document.getElementById("results").appendChild(div);
}

async function loadEta(company, stop, route, button){
  const box = button.parentElement.querySelector(".etaBox");
  box.innerHTML = `<div class="eta">正在讀取 ETA...</div>`;

  try{
    let data;

    if(company === "kmb"){
      data = await getJson(KMB + "/eta/" + stop + "/" + route + "/1");
    }else{
      data = await getJson(CTB + "/eta/ctb/" + stop + "/" + route);
    }

    const list = data.data || [];

    if(list.length === 0){
      box.innerHTML = `<div class="eta">暫時沒有到站時間</div>`;
      return;
    }

    box.innerHTML = list.slice(0,3).map(item => `
      <div class="eta">
        <div class="eta-main">${formatMinutes(item.eta)}</div>
        <div class="meta">預計：${formatTime(item.eta)}</div>
        <div class="meta">目的地：${item.dest_tc || item.dest_en || "-"}</div>
        <div class="meta">${item.rmk_tc || item.rmk_en || ""}</div>
      </div>
    `).join("");

  }catch(e){
    console.error(e);
    box.innerHTML = `<div class="eta">ETA 讀取失敗</div>`;
  }
}

searchRoute();
</script>

</body>
</html>
