<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>九巴即時到站時間</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px;
    }

    .header {
      background: linear-gradient(135deg, #d71920, #9b1116);
      color: white;
      padding: 22px;
      border-radius: 22px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 10px 0 6px;
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
    }

    input {
      text-transform: uppercase;
    }

    button {
      border: 0;
      background: #d71920;
      color: white;
      font-weight: bold;
      margin-top: 12px;
    }

    button.secondary {
      background: #374151;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .status {
      text-align: center;
      color: #6b7280;
      padding: 16px;
    }

    .stop {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
      margin-top: 10px;
      background: #fff;
    }

    .stop-title {
      font-weight: bold;
      font-size: 16px;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.4;
    }

    .eta {
      background: #f9fafb;
      border-radius: 14px;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #e5e7eb;
    }

    .eta-main {
      color: #d71920;
      font-size: 24px;
      font-weight: bold;
    }

    .small-note {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <h1>九巴即時到站時間</h1>
      <p>KMB ETA Public API Demo｜無需 API Key</p>
    </div>

    <div class="card">
      <label>輸入九巴路線</label>
      <input id="routeInput" value="1A" placeholder="例如：1A / 98D / 215X" />

      <div class="grid">
        <div>
          <label>方向</label>
          <select id="directionInput">
            <option value="outbound">去程 outbound</option>
            <option value="inbound">回程 inbound</option>
          </select>
        </div>

        <div>
          <label>服務類型</label>
          <select id="serviceInput">
            <option value="1">正常班次</option>
            <option value="2">特別班次 2</option>
            <option value="3">特別班次 3</option>
          </select>
        </div>
      </div>

      <button onclick="loadStops()">搜尋車站</button>

      <p class="small-note">
        用法：輸入路線 → 選方向 → 搜尋車站 → 按「查此站 ETA」。
      </p>
    </div>

    <div class="card">
      <div id="status" class="status">準備查詢</div>
      <div id="stops"></div>
    </div>

  </div>

<script>
  const API_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";

  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }

  function getRoute() {
    return document.getElementById("routeInput").value.trim().toUpperCase();
  }

  function getDirection() {
    return document.getElementById("directionInput").value;
  }

  function getServiceType() {
    return document.getElementById("serviceInput").value;
  }

  function formatMinutes(etaString) {
    if (!etaString) return "沒有資料";

    const etaTime = new Date(etaString);
    const now = new Date();
    const diffMin = Math.round((etaTime - now) / 60000);

    if (diffMin <= 0) return "即將到站";
    return diffMin + " 分鐘";
  }

  function formatClockTime(etaString) {
    if (!etaString) return "-";

    return new Date(etaString).toLocaleTimeString("zh-HK", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  async function fetchJson(url) {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("HTTP Error: " + response.status);
    }

    return await response.json();
  }

  async function getStopName(stopId) {
    try {
      const url = API_BASE + "/stop/" + stopId;
      const json = await fetchJson(url);

      if (!json.data) return stopId;

      return json.data.name_tc || json.data.name_en || stopId;
    } catch (error) {
      return stopId;
    }
  }

  async function loadStops() {
    const route = getRoute();
    const direction = getDirection();
    const serviceType = getServiceType();

    const stopsDiv = document.getElementById("stops");
    stopsDiv.innerHTML = "";

    if (!route) {
      setStatus("請先輸入九巴路線");
      return;
    }

    setStatus("正在讀取車站資料...");

    try {
      const url = API_BASE + "/route-stop/" + route + "/" + direction + "/" + serviceType;
      const json = await fetchJson(url);
      const routeStops = json.data || [];

      if (routeStops.length === 0) {
        setStatus("找不到車站。請檢查路線，或轉另一個方向。");
        return;
      }

      setStatus("找到 " + routeStops.length + " 個車站");

      for (const item of routeStops) {
        const stopId = item.stop;
        const stopName = await getStopName(stopId);

        const stopElement = document.createElement("div");
        stopElement.className = "stop";

        stopElement.innerHTML = `
          <div class="stop-title">${item.seq}. ${stopName}</div>
          <div class="muted">Stop ID: ${stopId}</div>
          <button onclick="loadEta('${stopId}', '${route}', '${serviceType}', this)">
            查此站 ETA
          </button>
          <div class="etaResult"></div>
        `;

        stopsDiv.appendChild(stopElement);
      }

    } catch (error) {
      console.error(error);
      setStatus("讀取失敗。可能是網絡問題、瀏覽器限制，或 API 暫時未能連線。");
    }
  }

  async function loadEta(stopId, route, serviceType, button) {
    const resultBox = button.parentElement.querySelector(".etaResult");

    resultBox.innerHTML = `
      <div class="eta">
        <div class="muted">正在讀取 ETA...</div>
      </div>
    `;

    try {
      const url = API_BASE + "/eta/" + stopId + "/" + route + "/" + serviceType;
      const json = await fetchJson(url);
      const etaList = json.data || [];

      if (etaList.length === 0) {
        resultBox.innerHTML = `
          <div class="eta">
            <div class="muted">暫時沒有到站時間</div>
          </div>
        `;
        return;
      }

      resultBox.innerHTML = etaList.slice(0, 3).map(item => {
        return `
          <div class="eta">
            <div class="eta-main">${formatMinutes(item.eta)}</div>
            <div class="muted">預計時間：${formatClockTime(item.eta)}</div>
            <div class="muted">目的地：${item.dest_tc || item.dest_en || "-"}</div>
            <div class="muted">${item.rmk_tc || item.rmk_en || ""}</div>
          </div>
        `;
      }).join("");

    } catch (error) {
      console.error(error);
      resultBox.innerHTML = `
        <div class="eta">
          <div class="muted">ETA 讀取失敗</div>
        </div>
      `;
    }
  }

  loadStops();
</script>

</body>
</html>
